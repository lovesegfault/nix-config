#####################################################################
#   Toolhead (SB2209)
#####################################################################

[mcu sb2209]
canbus_uuid: 8d3b2670e5f1

[extruder]
step_pin: sb2209:PD0
dir_pin: sb2209:PD1
enable_pin: !sb2209:PD2
rotation_distance: 22.5000017088
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
instantaneous_corner_velocity: 1.5
max_extrude_cross_section: 0.8
heater_pin: sb2209:PB13
pwm_cycle_time: 0.02
smooth_time: 0.5
max_power: 1.0
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: sb2209:PA3
control: pid
pid_kp: 23.253
pid_ki: 2.627
pid_kd: 51.451
min_extrude_temp: 170
min_temp: 0
max_temp: 300

[tmc2209 extruder]
uart_pin: sb2209:PA15
interpolate: false
run_current: 0.650
stealthchop_threshold: 0

[adxl345]
cs_pin: sb2209:PB12
spi_software_sclk_pin: sb2209:PB10
spi_software_mosi_pin: sb2209:PB11
spi_software_miso_pin: sb2209:PB2
axes_map: z,-y,x

[resonance_tester]
probe_points: 150, 150, 20
accel_chip: adxl345

[temperature_sensor sb2209]
sensor_type: Generic 3950
sensor_pin: sb2209:PA2

[neopixel sb_leds]
pin: sb2209:PD3
chain_count: 10
color_order: GRB,GRB,GRB,GRB,GRB,GRB,GRB,GRB,RGBW,RGBW
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 1.0

[fan]
pin: sb2209:PA1
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
pin: sb2209:PA0
heater: extruder
heater_temp: 50.0

## Voron Tap
[probe]
pin: sb2209:PB5
x_offset: 0
y_offset: 0
# Calibrated on the Pi 4 riemann with this toolhead. Tap triggers after the
# nozzle presses into the bed, so 0 here would drive Z=0 into the bed; keep a
# known-good value until PROBE_CALIBRATE + SAVE_CONFIG overrides it.
z_offset: -0.260
speed: 5.0
lift_speed: 50.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3
activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}
