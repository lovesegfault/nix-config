#####################################################################
#   Bring-up: stand-ins for hardware that isn't connected yet
#####################################################################
# Nothing here is calibrated or wired. Each block goes away as the real
# fragment (ab.cfg, toolhead.cfg, bed.cfg, homing.cfg) comes in.

## CoreXY needs X and Y steppers to exist. These hold the Leviathan's HV
## drivers disabled through EN; without a [tmc5160] section Klipper never talks
## to them, so it doesn't matter whether the 48V supply is on.
[stepper_x]
step_pin: PB10
dir_pin: !PB11
enable_pin: !PG0
rotation_distance: 40
microsteps: 32
endstop_pin: PC1
position_endstop: 300
position_max: 300
homing_positive_dir: true

[stepper_y]
step_pin: PF15
dir_pin: !PF14
enable_pin: !PE9
rotation_distance: 40
microsteps: 32
endstop_pin: PC2
position_endstop: 300
position_max: 300
homing_positive_dir: true

## z.cfg homes Z on the probe, which lives on the toolhead. This is the empty
## Z-PROBE header.
[probe]
pin: ^PF1
z_offset: 0

## No endstop above is real, so homing would run the gantry into something.
[homing_override]
axes: xyz
gcode:
    { action_raise_error("Homing is disabled during bring-up: the endstops and probe aren't connected") }

## Same fan as bed.cfg, minus the bed heater it watches.
[controller_fan controller_fan]
pin: PB7
kick_start_time: 0.5
heater:
fan_speed: 0.5

## FORCE_MOVE, for checking each Z motor's direction without homing.
[force_move]
enable_force_move: true
