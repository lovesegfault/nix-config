#####################################################################
#   Bed and electronics bay
#####################################################################

## HE1 drives the bed SSR; TH1 on the Leviathan, which has 2k2 pullups.
[heater_bed]
heater_pin: PG11
sensor_type: Generic 3950
sensor_pin: PA2
pullup_resistor: 2200
max_power: 1.0
min_temp: 0
max_temp: 135
control: pid
pid_kp: 68.629
pid_ki: 2.629
pid_kd: 447.807

## Electronics bay fan on FAN0.
[controller_fan controller_fan]
pin: PB7
kick_start_time: 0.5
heater: heater_bed
fan_speed: 0.5
