# Voron 2.4 300mm: LDO Leviathan v1.3 (USB-to-CAN bridge) + BTT SB2209 toolhead.
#
# Managed by NixOS (configurations/nixos/riemann/printer/): Klipper rewrites
# this file from Nix on every start and keeps only the SAVE_CONFIG section at
# the bottom, so change settings there rather than in Mainsail's editor.
#
# Leviathan pins follow LDO's voron2_leviathan.cfg, checked against the v1.3
# manual. The extension board's HV2/HV3 drivers are reserved for Monolith AWD
# later.

[mcu]
