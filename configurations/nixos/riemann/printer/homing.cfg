#####################################################################
#   Homing and leveling
#####################################################################

[idle_timeout]
timeout: 7200

[safe_z_home]
home_xy_position: 150,150
speed: 500
z_hop: 2.5
z_hop_speed: 50

[quad_gantry_level]
gantry_corners:
   -60,-10
   360,370
points:
   50,50
   50,225
   250,225
   250,50
speed: 500
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0075
max_adjust: 15

[bed_mesh]
speed: 500
horizontal_move_z: 2.5
mesh_min: 30, 30
mesh_max: 270,270
fade_start: 0.6
fade_end: 10.0
probe_count: 9,9
algorithm: bicubic
zero_reference_position: 150, 150

[exclude_object]
