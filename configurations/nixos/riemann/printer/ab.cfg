#####################################################################
#   A/B on the Leviathan's 48V TMC5160s
#####################################################################

## B motor (left), HV STEPPER 0. X endstop is on the toolhead.
[stepper_x]
step_pin: PB10
dir_pin: !PB11
enable_pin: !PG0
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: sb2209:PB6
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100
homing_positive_dir: true
homing_retract_dist: 5

[tmc5160 stepper_x]
spi_bus: spi4
cs_pin: PE15
interpolate: false
run_current: 1.3
sense_resistor: 0.075
stealthchop_threshold: 0

## A motor (right), HV STEPPER 1, Y endstop on Y-ENDSTOP.
[stepper_y]
step_pin: PF15
dir_pin: !PF14
enable_pin: !PE9
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: PC2
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100
homing_positive_dir: true
homing_retract_dist: 5

[tmc5160 stepper_y]
spi_bus: spi4
cs_pin: PE11
interpolate: false
run_current: 1.3
sense_resistor: 0.075
stealthchop_threshold: 0
